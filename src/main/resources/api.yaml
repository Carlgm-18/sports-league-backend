openapi: 3.0.3
info:
  title: API de Gestión de Ligas Deportivas (TFG)
  version: 1.1.0
  description: >
    API RESTful para el sistema de gestión deportiva.
    Incluye flujos de inscripción, gestión de roles (Administrador, Árbitro, Capitán, Jugador),
    máquina de estados para agendamiento de partidos y actas digitales con firmas.
servers:
  - url: http://localhost:8079/api/v1
    description: Servidor de Desarrollo Local

tags:
  - name: Usuarios
  - name: Ligas
  - name: Fases
  - name: Partidos
  - name: Equipos
  - name: Participaciones
  - name: Incidencias

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Role:
      type: string
      enum: [ 'ADMIN', 'REFEREE', 'PLAYER', 'CAPTAIN' ]

    ParticipantRoles:
      type: array
      items:
        $ref: '#/components/schemas/Role'

    ProposalState:
      type: string
      enum: [ 'PENDING', 'DISMISSED', 'APPROVED' ]

    RequestState:
      type: string
      enum: [ 'PENDING', 'REJECTED', 'ACCEPTED', 'CANCELED' ]

    LeagueState:
      type: string
      enum: [ 'TEAM_ASSEMBLE', 'MATCH_MAKING', 'IN_PROGRESS', 'ENDED' ]

    LeagueCategory:
      type: string
      enum: [ 'MALE', 'FEMALE', 'BOTH' ]

    DateTimeSlot:
      type: object
      required: [ dateTime, duration ]
      properties:
        dateTime:
          type: string
          format: date-time
        duration:
          type: integer
          description: 'Slot duration in hours'

    MatchState:
      type: string
      enum: [ 'NOT_SCHEDULED', 'SCHEDULED', 'IN_GAME', 'ENDED' ]

    UserCategory:
      type: string
      enum: [ 'MALE', 'FEMALE' ]

    SignImageUrl:
      type: object
      required: [ imageUrl ]
      properties:
        signImageUrl:
          type: string
          format: uri
        uploatAt:
          type: string
          format: date-time

    LicenceElement:
      type: object
      required: [sportName, license]
      properties:
        sportName:
          type: string
        license:
          type: string

    LicensesList:
      type: array
      items:
        $ref: '#/components/schemas/LicenceElement'

    FormErrorResponse:
      type: object
      required: [ timestamp, status, errors ]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        errors:
          type: array
          description: 'Lista detallada de fallos de validación en campos específicos'
          items:
            $ref: '#/components/schemas/ValidationError'

    ValidationError:
      type: object
      required: [ field, message, rejectedValue ]
      properties:
        field:
          type: string
          example: 'email'
        message:
          type: string
          example: 'El formato del correo electrónico no es válido.'
        rejectedValue:
          type: string
          example: 'juan-at-uib.es'

    UserCreateRequest:
      type: object
      required: [ firstName, lastName, email, password, confirmPassword, category ]
      properties:
        firstName:
          type: string
          maxLength: 50
        lastName:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 50
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 64
        confirmPassword:
          type: string
          format: password
          minLength: 10
          maxLength: 64
        category:
          $ref: '#/components/schemas/UserCategory'
        licenses:
          $ref: '#/components/schemas/LicensesList'

    UserCreateResponse:
      type: object
      required: [ firstName, lastName, email, category ]
      properties:
        firstName:
          type: string
          maxLength: 50
        lastName:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 50
        category:
          $ref: '#/components/schemas/UserCategory'
        licenses:
          $ref: '#/components/schemas/LicensesList'


    UserUpdateRequest:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 50
        lastName:
          type: string
          maxLength: 50
        category:
          $ref: '#/components/schemas/UserCategory'
        licenses:
          $ref: '#/components/schemas/LicensesList'

    UserLoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
          maxLength: 50
        password:
          type: string
          format: password
          maxLength: 50

    UserDetails:
      type: object
      required:
        [
          userId,
          fullName,
          email,
          profileImageUrl,
          category,
          createdAt,
          licenses,
        ]
      properties:
        userId:
          type: integer
        fullName:
          type: string
        email:
          type: string
          format: email
        category:
          $ref: '#/components/schemas/UserCategory'
        createdAt:
          type: string
          format: date-time
        profileImageUrl:
          type: string
          format: uri
        signature:
          $ref: '#/components/schemas/SignImageUrl'
        licenses:
          $ref: '#/components/schemas/LicensesList'

    UserSummary:
      type: object
      required: [ userId, fullName, category, profileImageUrl ]
      properties:
        userId:
          type: integer
        fullName:
          type: string
        category:
          $ref: '#/components/schemas/UserCategory'
        profileImageUrl:
          type: string
          format: uri

    UserAuthResponse:
      type: object
      required: [ accessToken, refreshToken, expiresIn, tokenType, user ]
      properties:
        accessToken:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: 'Segundos de validez del token'
          example: 3600
        tokenType:
          type: string
          example: "Bearer"
        user:
          $ref: '#/components/schemas/UserSummary'

    LeagueCreateRequest:
      type: object
      required:
        [
          name,
          description,
          locationUrl,
          startDate,
          endDate,
          maxInscriptionDate,
          configuration,
          phases,
        ]
      properties:
        name:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 500
        iconImageUrl:
          type: string
          format: uri
        bannerImageUrl:
          type: string
          format: uri
        locationUrl:
          type: string
          format: uri
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        maxInscriptionDate:
          type: string
          format: date-time
        configuration:
          $ref: '#/components/schemas/ConfigurationCreateRequest'
        punctuationSystem:
          $ref: '#/components/schemas/PunctuationSystemCreateRequest'
        phases:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/TournamentPhaseDetails'
              - $ref: '#/components/schemas/ClassificationPhase'

    LeagueUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 500
        iconImageUrl:
          type: string
          format: uri
        bannerImageUrl:
          type: string
          format: uri
        locationUrl:
          type: string
          format: uri
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        maxInscriptionDate:
          type: string
          format: date-time
        phases:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/TournamentPhaseDetails'
              - $ref: '#/components/schemas/ClassificationPhase'

    ConfigurationCreateRequest:
      type: object
      required:
        [ category, minTeamMembers, maxTeamMembers, roundDuration, sportName ]
      properties:
        category:
          $ref: '#/components/schemas/LeagueCategory'
        minTeamFemaleIntegrants:
          type: integer
          minimum: 1
        minTeamMembers:
          type: integer
          minimum: 2
          maximum: 20
        maxTeamMembers:
          type: integer
          minimum: 20
          maximum: 50
        roundDuration:
          type: integer
          description: 'Duración de una jornada en semanas'
          minimum: 1
          maximum: 4
        sportName:
          type: string

    ConfigurationUpdateRequest:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/LeagueCategory'
        minTeamFemaleIntegrants:
          type: integer
        minTeamMembers:
          type: integer
        maxTeamMembers:
          type: integer
        roundDuration:
          type: integer
          description: 'Duración de una jornada en semanas'

    ConfigurationDetails:
      type: object
      required:
        [ category, minTeamMembers, maxTeamMembers, roundDuration, sportName ]
      properties:
        category:
          $ref: '#/components/schemas/LeagueCategory'
        minTeamFemaleIntegrants:
          type: integer
        minTeamMembers:
          type: integer
        maxTeamMembers:
          type: integer
        roundDuration:
          type: integer
          description: 'Duración de una jornada en semanas'
        sportName:
          type: string

    PunctuationSystemCreateRequest:
      type: array
      items:
        $ref: '#/components/schemas/PunctuationSystemRuleDetails'

    PunctuationSystemRuleDetails:
      type: object
      required: [ localScore, visitorScore, localPoints, visitorPoints ]
      properties:
        localScore:
          type: integer
        visitorScore:
          type: integer
        localPoints:
          type: integer
        visitorPoints:
          type: integer

    LeagueBasePhase:
      type: object
      required: [ name, startDate, endDate, sequenceOrder ]
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        sequenceOrder:
          type: string
        rounds:
          type: array
          items:
            $ref: '#/components/schemas/RoundDetails'

    TournamentPhaseDetails:
      allOf:
        - $ref: '#/components/schemas/LeagueBasePhase'
        - type: object
          properties:
            matchesOrder:
              type: array
              items:
                $ref: '#/components/schemas/TournamentSlot'

    TournamentSlot:
      type: object
      required: [ indexOrder, match ]
      properties:
        indexOrder:
          type: integer
        match:
          $ref: '#/components/schemas/MatchDetails'

    ClassificationPhase:
      allOf:
        - $ref: '#/components/schemas/LeagueBasePhase'
        - type: object
          properties:
            groups:
              type: array
              items:
                $ref: '#/components/schemas/ClassificationGroup'

    ClassificationPhaseDetails:
      allOf:
        - $ref: '#/components/schemas/LeagueBasePhase'
        - $ref: '#/components/schemas/LeaderboardResponse'
        - type: object
          properties:
            groups:
              type: array
              items:
                $ref: '#/components/schemas/ClassificationGroup'

    ClassificationGroup:
      type: object
      required: [ topWinners ]
      properties:
        topWinners:
          type: integer
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamDetails'

    LeagueDetails:
      type: object
      required:
        [
          leagueId,
          name,
          description,
          iconImageUrl,
          bannerImageUrl,
          locationUrl,
          startDate,
          endDate,
          maxInscriptionDate,
          status,
          createdAt,
          configuration,
        ]
      properties:
        leagueId:
          type: integer
        name:
          type: string
        description:
          type: string
        iconImageUrl:
          type: string
          format: uri
        bannerImageUrl:
          type: string
          format: uri
        locationUrl:
          type: string
          format: uri
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        maxInscriptionDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/LeagueState'
        createdAt:
          type: string
          format: date-time
        configuration:
          $ref: '#/components/schemas/ConfigurationDetails'
        punctuationSystem:
          $ref: '#/components/schemas/PunctuationSystemRuleDetails'

    LeagueSummary:
      type: object
      required:
        [
          leagueId,
          name,
          description,
          iconImageUrl,
          bannerImageUrl,
          locationUrl,
          startDate,
          endDate,
          maxInscriptionDate,
          status,
          category,
        ]
      properties:
        leagueId:
          type: integer
        name:
          type: string
        description:
          type: string
        iconImageUrl:
          type: string
          format: uri
        bannerImageUrl:
          type: string
          format: uri
        locationUrl:
          type: string
          format: uri
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        maxInscriptionDate:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/LeagueState'

    ParticipantDetails:
      type: object
      required: [ participantId, userId, leagueId, team, dorsal, roles, joinDate ]
      properties:
        participantId:
          type: integer
        userId:
          type: integer
        team:
          $ref: '#/components/schemas/TeamDetails'
        dorsal:
          type: integer
          description: 'Número del dorsal del jugador cuando está en un equipo'
        roles:
          type: array
          items:
            type: string
        joinDate:
          type: string
          format: date-time

    ParticipantSummary:
      type: object
      required: [ participantId, team, dorsal, roles, joinDate ]
      properties:
        participantId:
          type: integer
        fullName:
          type: string
        team:
          $ref: '#/components/schemas/TeamSummary'
        dorsal:
          type: integer
          description: 'Número del dorsal del jugador cuando está en un equipo'

    TeamDetails:
      type: object
      required:
        [
          teamId,
          name,
          initials,
          description,
          motto,
          primaryColor,
          secondaryColor,
          iconImageUrl,
          leagueId,
        ]
      properties:
        teamId:
          type: integer
        name:
          type: string
        initials:
          type: string
          format: regex
          pattern: '[A-Z][0-9A-Z]'
        description:
          type: string
          maxLength: 500
        motto:
          type: string
        primaryColor:
          type: string
          format: regex
          pattern: '#[0-9A-F]{8}'
          example: '#FFAABB77'
        secondaryColor:
          type: string
          format: regex
          pattern: '#[0-9A-F]{8}'
          example: '#FFAABB77'
        iconImageUrl:
          type: string
          format: uri
        deletedAt:
          type: string
          format: date-time
        leagueId:
          type: integer

    TeamSummary:
      type: object
      required:
        [
          teamId,
          name,
          initials,
          motto,
          primaryColor,
          secondaryColor,
          iconImageUrl,
        ]
      properties:
        teamId:
          type: integer
        name:
          type: string
        initials:
          type: string
          format: regex
          pattern: '[A-Z][0-9A-Z]'
        motto:
          type: string
        primaryColor:
          type: string
          format: regex
          pattern: '#[0-9A-F]{8}'
          example: '#FFAABB77'
        secondaryColor:
          type: string
          format: regex
          pattern: '#[0-9A-F]{8}'
          example: '#FFAABB77'
        iconImageUrl:
          type: string
          format: uri

    TeamMembersDetails:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantDetails'

    BaseRequest:
      type: object
      required:
        [ requestId, participantId, leagueId, createdAt, resolvedAt, message ]
      properties:
        requestId:
          type: integer
        participantId:
          type: integer
        leagueId:
          type: integer
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string
        status:
          $ref: '#/components/schemas/RequestState'

    TeamJoinRequest:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          required: [ teamId ]
          properties:
            teamId:
              type: integer
              example: 101

    TeamCreateRequest:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          required:
            [ name, initials, description, motto, primaryColor, secondaryColor ]
          properties:
            name:
              type: string
            initials:
              type: string
            description:
              type: string
            motto:
              type: string
            primaryColor:
              type: string
              format: regex
              pattern: '#[0-9A-F]{8}'
              example: '#FFAABB77'
            secondaryColor:
              type: string
              format: regex
              pattern: '#[0-9A-F]{8}'
              example: '#FFAABB77'
            iconImageUrl:
              type: string
              format: uri

    RefereeRequest:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          required: [ licenseReference ]
          properties:
            licenseReference:
              type: string
              example: 'UIB-REF-2026-X88'

    MatchDateProposalRequest:
      type: object
      required: [ status, proposedAt, dateTimeSlot ]
      properties:
        requestId:
          type: integer
        status:
          $ref: '#/components/schemas/ProposalState'
        dateTimeSlot:
          $ref: '#/components/schemas/DateTimeSlot'
        proposedAt:
          type: string
          format: date-time

    MatchDateProposalDetails:
      type: object
      required: [ status, proposedAt, dateTimeSlot ]
      properties:
        requestId:
          type: integer
        status:
          $ref: '#/components/schemas/ProposalState'
        dateTimeSlot:
          $ref: '#/components/schemas/DateTimeSlot'
        proposedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time

    MatchDetails:
      type: object
      required: [
        matchId,
        status,
        localTeam
          visitorTeam,
        dateTime,
        proposal,
        roundId,
        firstReferee,
        resultSummary,
        resultDetails,
      ]
      properties:
        matchId:
          type: integer
        status:
          $ref: '#/components/schemas/MatchState'
        localTeam:
          $ref: '#/components/schemas/TeamSummary'
        visitorTeam:
          $ref: '#/components/schemas/TeamSummary'
        dateTime:
          $ref: '#/components/schemas/DateTimeSlot'
        proposal:
          $ref: '#/components/schemas/MatchDateProposalDetails'
        roundId:
          type: integer
        firstReferee:
          $ref: '#/components/schemas/ParticipantDetails'
        secondReferee:
          $ref: '#/components/schemas/ParticipantDetails'
        resultSummary:
          $ref: '#/components/schemas/ResultSummary'
        resultDetails:
          $ref: '#/components/schemas/ResultDetails'

    MatchSummary:
      type: object
      required: [
        matchId,
        status,
        localTeam
          visitorTeam,
        dateTime,
        proposal,
        roundId,
        firstReferee,
        resultSummary,
      ]
      properties:
        matchId:
          type: integer
        status:
          $ref: '#/components/schemas/MatchState'
        localTeam:
          $ref: '#/components/schemas/TeamSummary'
        visitorTeam:
          $ref: '#/components/schemas/TeamSummary'
        dateTime:
          $ref: '#/components/schemas/DateTimeSlot'
        proposal:
          $ref: '#/components/schemas/MatchDateProposalDetails'
        roundId:
          type: integer
        firstReferee:
          $ref: '#/components/schemas/ParticipantDetails'
        secondReferee:
          $ref: '#/components/schemas/ParticipantDetails'
        resultSummary:
          $ref: '#/components/schemas/ResultSummary'
        resultDetails:
          $ref: '#/components/schemas/ResultDetails'

    ResultSummary:
      type: object
      required: [ localTotalScore, visitorTotalScore, recordUrl ]
      properties:
        localTotalScore:
          type: integer
        visitorTotalScore:
          type: integer
        recordUrl:
          type: string
          format: uri

    ResultDetails:
      allOf:
        - $ref: '#/components/schemas/ResultSummary'
        - type: object
          required: [ signatures, observations, periods ]
          properties:
            signatures:
              type: object
              required: [ beforeMatchSignatures, afterMatchSignatures ]
              properties:
                beforeMatchSignatures:
                  $ref: '#/components/schemas/MatchSignatures'
                afterMatchSignatures:
                  $ref: '#/components/schemas/MatchSignatures'
            observations:
              type: array
              items:
                type: string
            periods:
              type: array
              items:
                $ref: '#/components/schemas/MatchPeriod'

    MatchSignatures:
      type: object
      required:
        [
          firstRefereeSignature,
          secondRefereeSignature,
          localCaptainSignature,
          visitorCaptainSignature,
        ]
      properties:
        firstRefereeSignature:
          $ref: '#/components/schemas/SignImageUrl'
        secondRefereeSignature:
          $ref: '#/components/schemas/SignImageUrl'
        localCaptainSignature:
          $ref: '#/components/schemas/SignImageUrl'
        visitorCaptainSignature:
          $ref: '#/components/schemas/SignImageUrl'

    MatchPeriod:
      type: object
      required: [ periodNumber, localScore, visitorScore, periodType, events ]
      properties:
        periodNumber:
          type: integer
        localScore:
          type: integer
        visitorScore:
          type: integer
        periodType:
          type: string
          description: 'Ej: HALF, QUARTER, SET'
        events:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/SubstitutionEvent'
              - $ref: '#/components/schemas/SanctionEvent'
              - $ref: '#/components/schemas/TimeoutEvent'

    MatchEvent:
      type: object
      required:
        [ happenedAtTime, atLocalScore, atVisitorScore, responsibleTeamId ]
      properties:
        happenedAtTime:
          type: integer
          format: time
        atLocalScore:
          type: integer
        atVisitorScore:
          type: integer
        responsibleTeamId:
          type: integer

    SubstitutionEvent:
      allOf:
        - $ref: '#/components/schemas/MatchEvent'
        - type: object
          required: [ incomingPlayer, outgoingPlayer ]
          properties:
            incomingPlayer:
              $ref: '#/components/schemas/ParticipantDetails'
            outgoingPlayer:
              $ref: '#/components/schemas/ParticipantDetails'

    SanctionEvent:
      allOf:
        - $ref: '#/components/schemas/MatchEvent'
        - type: object
          required: [ sactionType, reason, appliedTo ]
          properties:
            sactionType:
              type: string
            reason:
              type: string
            appliedTo:
              $ref: '#/components/schemas/ParticipantDetails'

    TimeoutEvent:
      allOf:
        - $ref: '#/components/schemas/MatchEvent'
        - type: object
          required: [ durationTime ]
          properties:
            durationTime:
              type: string
              format: regex
              pattern: '[0-9]{2}:[0-9]{2}'
              description: 'Timeout duration in minutes and seconds'

    IncidenceCreateRequest:
      type: object
      required: [ description ]
      properties:
        description:
          type: string

    IncidenceUpdateRequest:
      type: object
      required: [ reason ]
      properties:
        reason:
          type: string

    IncidenceDetails:
      type: object
      required: [ description, resolution ]
      properties:
        incidenceId:
          type: integer
        description:
          type: string
        resolution:
          type: string

    UserLeagueStatus:
      type: object
      required: [ leagueId, roles, joinDate ]
      properties:
        leagueId:
          type: integer
        participantId:
          type: integer
        teamId:
          type: integer
          description: 'Nulo si el usuario aún no tiene equipo en esta liga'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        joinDate:
          type: string
          format: date-time

    LeaderboardRow:
      type: object
      required: [ position, team, playedMatches ]
      properties:
        position:
          type: integer
        team:
          $ref: '#/components/schemas/TeamSummary'
        playedMatches:
          type: integer
        wonMatches:
          type: integer
        lostMatches:
          type: integer
        drawnMatches:
          type: integer
        points:
          type: integer
        wonSets:
          type: integer
        lostSets:
          type: integer
        wonPoints:
          type: integer
        lostPoints:
          type: integer

    LeaderboardGroup:
      type: object
      required: [ groupId, groupName, standings ]
      description: "Esquema para agrupar clasificaciones (Ej: Grupo A, Grupo B, o 'General')"
      properties:
        groupId:
          type: integer
        groupName:
          type: string
        standings:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardRow'

    LeaderboardResponse:
      type: array
      items:
        $ref: '#/components/schemas/LeaderboardGroup'

    PhaseDetails:
      type: object
      properties:
        phaseId:
          type: integer
        phases:
          oneOf:
            - $ref: '#/components/schemas/ClassificationPhaseDetails'
            - $ref: '#/components/schemas/TournamentPhaseDetails'
          discriminator:
            propertyName: type

    RoundDetails:
      type: object
      required: [ roundId, roundNumber, startDate ]
      properties:
        roundId:
          type: integer
        roundNumber:
          type: integer
          description: 'Jornada 1, Jornada 2, etc.'
        startDate:
          type: string
          format: date
          description: 'Día en que empieza dicha ronda'

  responses:
    BadRequest:
      description: 'Los datos enviados son incorrectos o el formulario es inválido.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormErrorResponse'
    Unauthorized:
      description: 'Es necesario iniciar sesión'

security:
  - bearerAuth: [ ]

paths:
  # ==========================================
  # MÓDULO DE USUARIOS Y AUTENTICACIÓN
  # ==========================================
  /users/register:
    post:
      tags:
        - Usuarios
      summary: Crear una nueva cuenta de usuario
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: 'Usuario creado con éxito'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 'El email ya está registrado.'

  /users/login:
    post:
      tags:
        - Usuarios
      summary: Iniciar sesión
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: 'Devuelve el JWT Token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAuthResponse'
        '401':
          description: 'Credenciales inválidas'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormErrorResponse'

  /auth/external-authentication:
    post:
      tags:
        - Usuarios
      summary: Verifica la autenticación de un usuario desde un servicio externo
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                serviceName:
                  type: string
      responses:
        '200':
          description: 'Usuario creado con éxito'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          description: 'El servicio ha sufrido un error'
        '503':
          description: 'Servicio no disponible'

  /users/me/signature:
    put:
      summary: Actualizar la firma del usuario
      description: 'Pide una URL prefirmada al backend para persistir la imagen de la firma y sube la URL para acceder desde el sistema S3.'
      tags:
        - Usuarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignImageUrl'
      responses:
        '200':
          description: 'Firma guardada'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me:
    get:
      summary: Obtener la información pública del usuario actual
      tags:
        - Usuarios
      responses:
        '200':
          description: 'Detalles del usuario'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      summary: Permitir al usuario editar los detalles de su cuenta
      tags:
        - Usuarios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: 'Cambios guardados de forma exitosa'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/invitations:
    get:
      summary: Obtener todas las invitaciones pendientes del usuario
      description: 'Devuelve las solicitudes de unión a equipos.'
      tags:
        - Usuarios
      responses:
        '200':
          description: 'Lista global de invitaciones'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamJoinRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/invitations/{requestId}:
    patch:
      summary: Jugador acepta/rechaza unirse a un equipo
      tags:
        - Usuarios
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ status ]
              properties:
                status:
                  $ref: '#/components/schemas/RequestState'
      responses:
        '200':
          description: 'Invitación resuelta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/leagues:
    get:
      tags:
        - Usuarios
      summary: Listar ligas en las que el usuario participa
      responses:
        '200':
          description: 'Lista de ligas del usuario'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeagueDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # MÓDULO DE LIGAS (Jerarquía principal)
  # ==========================================
  /leagues:
    get:
      tags:
        - Ligas
      summary: Listar ligas
      security: [ ]
      responses:
        '200':
          description: 'Lista de ligas'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeagueDetails'
    post:
      tags:
        - Ligas
      summary: Crear una nueva liga
      description: 'El creador se convierte automáticamente en Administrador.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeagueCreateRequest'
      responses:
        '201':
          description: 'Liga creada'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /leagues/{leagueId}:
    get:
      tags:
        - Ligas
      summary: Detalle de la liga y su configuración
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Datos de la liga'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueDetails'
        '404':
          description: 'Liga no encontrada.'
    patch:
      tags:
        - Ligas
      summary: Cambiar los detalles de una liga
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeagueUpdateRequest'
      responses:
        '200':
          description: 'Cambios aplicados correctamente'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Solo Administradores.'
        '404':
          description: 'Liga no encontrada.'
    delete:
      tags:
        - Ligas
      summary: Eliminar liga (Soft Delete)
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 'Liga eliminada'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Solo Administradores.'

  /leagues/{leagueId}/incidences:
    post:
      tags:
        - Incidencias
      summary: Crear una incidencia dentro de la liga
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidenceCreateRequest'
      responses:
        '201':
          description: 'Incidencia reportada'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidenceDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /leagues/{leagueId}/incidences/{incidenceId}:
    patch:
      tags:
        - Incidencias
      summary: Actualizar o resolver una incidencia
      description: Permite modificar los detalles de una incidencia específica (ej. para añadir la resolución).
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
        - in: path
          name: incidenceId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidenceUpdateRequest'
      responses:
        '200':
          description: 'Incidencia actualizada correctamente.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidenceDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Solo administradores o el creador original.'
        '404':
          description: 'Incidencia no encontrada.'

  /leagues/{leagueId}/leaderboard:
    get:
      tags:
        - Ligas
      summary: Obtener la clasificación
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
        - in: query
          name: phaseId
          description: 'ID de la fase (Apertura, Clausura, etc.) para ver su clasificación específica.'
          schema:
            type: integer
        - in: query
          name: roundId
          description: 'ID de la jornada para obtener histórico.'
          schema:
            type: integer
      responses:
        '200':
          description: 'Datos de la clasificación agrupados'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
        '404':
          description: 'Liga no encontrada.'

  /leagues/{leagueId}/configuration:
    patch:
      tags:
        - Ligas
      summary: Modificar la configuración de la liga
      description: Permite al administrador cambiar parámetros de negocio como el mínimo de jugadores, categoría o duración de las rondas sin tocar los datos básicos de la liga.
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationUpdateRequest'
      responses:
        '200':
          description: 'Configuración actualizada correctamente'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Solo Administradores.'
        '404':
          description: 'Liga no encontrada.'

  /leagues/{leagueId}/punctuation-system:
    put:
      tags:
        - Ligas
      summary: Sobrescribir el sistema de puntuación de la liga
      description: >
        Reemplaza todas las reglas de puntuación existentes por las nuevas enviadas en el array. 
        Ideal para cuando el administrador cambia el formato (ej. pasar de 'mejor de 5' a 'mejor de 3' sets).
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PunctuationSystemCreateRequest'
      responses:
        '200':
          description: 'Sistema de puntuación actualizado'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PunctuationSystemRuleDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Solo Administradores.'
        '404':
          description: 'Liga no encontrada.'

  # ---- Sub-recursos de Ligas ----
  /leagues/{leagueId}/participants:
    get:
      tags:
        - Participaciones
      summary: Listar participantes de la liga
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Lista de Participations'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParticipantDetails'
        '404':
          description: 'Liga no encontrada.'
    post:
      tags:
        - Participaciones
      summary: Unirse a una liga
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: 'Inscripción exitosa'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 'El usuario ya participa en esta liga.'

  /leagues/{leagueId}/participants/{participantId}:
    patch:
      tags:
        - Participaciones
      summary: Modificar roles de un participante (Asignar/Retirar Árbitro o Admin)
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
        - in: path
          name: participantId
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantRoles'
      responses:
        '200':
          description: 'Roles actualizados'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Solo Administradores.'
    delete:
      tags:
        - Participaciones
      summary: Expulsar a un participante de la liga
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
        - in: path
          name: participantId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 'Participante expulsado'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Solo Administradores.'

  /leagues/{leagueId}/teams:
    get:
      tags:
        - Ligas
      summary: Listar equipos de la liga
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Lista de equipos'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamDetails'
    post:
      tags:
        - Ligas
      summary: Solicitar creación de un equipo
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
      responses:
        '201':
          description: 'Solicitud de equipo enviada'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /leagues/{leagueId}/teams/requests/{requestId}:
    patch:
      tags:
        - Ligas
      summary: Admin acepta/rechaza solicitud de creación de equipo
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
        - in: path
          name: requestId
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ status ]
              properties:
                status:
                  $ref: '#/components/schemas/RequestState'
                rejectionReason:
                  type: string
      responses:
        '200':
          description: 'Solicitud resuelta. Si es ACCEPTED, el creador se vuelve CAPITÁN.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Solo Administrador.'

  /leagues/{leagueId}/teams/{teamId}:
    get:
      tags:
        - Ligas
      summary: Obtener detalle del equipo
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
        - in: path
          name: teamId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Detalle del equipo'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TeamDetails'
                  - $ref: '#/components/schemas/TeamMembersDetails'

        '404':
          description: 'Equipo no encontrado.'
    delete:
      tags:
        - Ligas
      summary: Eliminar equipo (Soft Delete)
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
        - in: path
          name: teamId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 'Equipo eliminado'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Solo Capitán o Admin.'

  /leagues/{leagueId}/matches:
    get:
      tags:
        - Ligas
      summary: Listar partidos de la liga
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
        - in: query
          name: phaseId
          description: 'Filtrar partidos por una fase específica'
          schema:
            type: integer
        - in: query
          name: teamId
          description: 'Filtrar partidos de un equipo concreto'
          schema:
            type: integer
        - in: query
          name: status
          description: 'Filtrar por estado del partido (Ej: PENDING, ENDED)'
          schema:
            $ref: '#/components/schemas/MatchState'
      responses:
        '200':
          description: 'Calendario de partidos generados'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchDetails'

  /leagues/{leagueId}/referee-requests:
    post:
      tags:
        - Ligas
      summary: Solicitar rol de árbitro en esta liga
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefereeRequest'
      responses:
        '201':
          description: 'Solicitud enviada al administrador'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /leagues/{leagueId}/referee-requests/{requestId}:
    patch:
      tags:
        - Ligas
      summary: Admin acepta/rechaza solicitud de árbitro
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
        - in: path
          name: requestId
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ status ]
              properties:
                status:
                  $ref: '#/components/schemas/RequestState'
                rejectionReason:
                  type: string
      responses:
        '200':
          description: 'Solicitud resuelta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Solo Administrador.'

  # ==========================================
  # MÓDULO DE EQUIPOS (Shallow Nesting)
  # ==========================================
  /teams/{teamId}/join-requests:
    post:
      tags:
        - Equipos
      summary: Jugador solicita unirse al equipo
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamJoinRequest'
      responses:
        '201':
          description: 'Solicitud pendiente para el capitán'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
        - Equipos
      summary: Listar solicitudes de unión al equipo
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Lista de solicitudes pendientes'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamJoinRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Solo Capitán.'

  /teams/{teamId}/join-requests/{requestId}:
    patch:
      tags:
        - Equipos
      summary: Capitán acepta/rechaza solicitud de jugador
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: integer
        - in: path
          name: requestId
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ status ]
              properties:
                status:
                  $ref: '#/components/schemas/RequestState'
      responses:
        '200':
          description: 'Estado actualizado'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Solo Capitán.'

  /teams/{teamId}/invitations:
    post:
      tags:
        - Equipos
      summary: Capitán invita a un jugador sin equipo
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ participantId ]
              properties:
                participantId:
                  type: integer
      responses:
        '201':
          description: 'Invitación enviada al jugador'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Solo Capitán.'

  /teams/{teamId}/members/{participantId}:
    delete:
      tags:
        - Equipos
      summary: Capitán expulsa a un jugador del equipo
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: integer
        - in: path
          name: participantId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 'Jugador expulsado'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Solo Capitán.'
    patch:
      tags:
        - Equipos
      summary: Jugador elige/cambia su dorsal
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: integer
        - in: path
          name: participantId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ dorsal ]
              properties:
                dorsal:
                  type: integer
      responses:
        '200':
          description: 'Dorsal asignado'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 'Error: este dorsal ya está asignado'

  # ==========================================
  # MÓDULO DE PARTIDOS Y ACTAS (Máquina de estados)
  # ==========================================
  /matches/{matchId}:
    get:
      tags:
        - Partidos
      summary: Obtener detalle del partido y su acta
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Toda la info del partido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchDetails'
        '404':
          description: 'Partido no encontrado.'

  /matches/{matchId}/schedule/proposals:
    post:
      tags:
        - Partidos
      summary: Negociación de fechas (Contrapropuesta)
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchDateProposalRequest'
      responses:
        '201':
          description: 'Propuesta enviada'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Solo Capitán.'

  /matches/{matchId}/schedule/accept:
    patch:
      tags:
        - Partidos
      summary: Aceptar propuesta de fecha
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Fecha fijada de mutuo acuerdo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Solo Capitán rival.'

  /matches/{matchId}/schedule/force:
    patch:
      tags:
        - Partidos
      summary: Administrador fija la fecha del partido
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DateTimeSlot'
      responses:
        '200':
          description: 'Fecha fijada'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Solo Administradores.'

  /matches/{matchId}/result:
    put:
      tags:
        - Partidos
      summary: Subir acta y cerrar partido
      description: 'Sube todos los periodos, eventos y resultados en bloque.'
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultDetails'
      responses:
        '200':
          description: 'Acta registrada y partido consolidado'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Solo el Árbitro asignado.'

  /matches/{matchId}/signatures:
    patch:
      tags:
        - Partidos
      summary: Firmar el acta del partido de forma individual
      description: >
        Permite a un capitán o árbitro firmar el acta desde su propio dispositivo. 
        El backend deduce quién está firmando mediante el token JWT, verifica que participa 
        en este partido y estampa la firma que el usuario tiene guardada en su perfil.
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ moment ]
              properties:
                moment:
                  type: string
                  enum: [ 'PRE_MATCH', 'POST_MATCH' ]
                  description: 'Indica si es la firma previa al inicio o la validación final del resultado.'
      responses:
        '200':
          description: 'Firma registrada correctamente en el acta.'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: El usuario actual no es ni el capitán ni el árbitro asignado a este partido.'
        '409':
          description: 'Conflicto: El usuario ya ha firmado esta acta para el momento especificado.'

  /matches/{matchId}/start:
    patch:
      tags:
        - Partidos
      summary: Iniciar el partido (Cambiar estado a IN_GAME)
      description: >
        El árbitro principal inicia el partido. Valida que el estado actual sea SCHEDULED 
        y que las firmas PRE_MATCH obligatorias (capitanes y árbitros) estén registradas.
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Partido iniciado correctamente.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Solo el Árbitro asignado puede iniciar el partido.'
        '409':
          description: 'Conflicto: El partido no está en estado SCHEDULED o faltan firmas previas.'

  /matches/{matchId}/finish:
    patch:
      tags:
        - Partidos
      summary: Finalizar el partido (Cambiar estado a ENDED)
      description: >
        El árbitro marca el final del tiempo reglamentario. Cambia el estado a ENDED, 
        bloqueando la creación de nuevos eventos (goles, tarjetas). Tras esto, quedará 
        pendiente la subida del acta final y las firmas POST_MATCH.
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Partido finalizado. Listo para el cierre de acta.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Solo el Árbitro asignado puede finalizar el partido.'
        '409':
          description: 'Conflicto: El partido no está en estado IN_GAME.'

  # ==========================================
  # MÓDULO DE DISPONIBILIDADES (Agendamiento)
  # ==========================================

  # ---- Disponibilidad de la Ubicación (Cancha/Pista) ----
  /leagues/{leagueId}/phases/{phaseId}/rounds/{roundId}/availability:
    get:
      tags:
        - Ligas
      summary: Obtener la disponibilidad de la ubicación para una jornada
      description: Devuelve las franjas horarias (slots) en las que la pista está libre para esta ronda.
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
        - in: path
          name: phaseId
          required: true
          schema:
            type: integer
        - in: path
          name: roundId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Lista de franjas horarias disponibles de la liga'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DateTimeSlot'
        '404':
          description: 'Ronda o liga no encontrada.'

    put:
      tags:
        - Ligas
      summary: Establecer o actualizar la disponibilidad de la ubicación
      description: >
        El administrador envía la lista completa de franjas horarias en las que se pueden jugar 
        los partidos de esta jornada. Esto sobrescribe cualquier disponibilidad anterior.
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
        - in: path
          name: phaseId
          required: true
          schema:
            type: integer
        - in: path
          name: roundId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DateTimeSlot'
      responses:
        '200':
          description: 'Disponibilidad de la ubicación guardada correctamente.'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Solo Administradores de la liga.'

  # ---- Disponibilidad Individual del Participante ----
  /leagues/{leagueId}/phases/{phaseId}/rounds/{roundId}/participants/{participantId}/availability:
    get:
      tags:
        - Participaciones
      summary: Obtener la disponibilidad de un participante
      description: Muestra en qué franjas horarias puede jugar/arbitrar este participante durante esta ronda específica.
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
        - in: path
          name: phaseId
          required: true
          schema:
            type: integer
        - in: path
          name: roundId
          required: true
          schema:
            type: integer
        - in: path
          name: participantId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Lista de franjas elegidas por el participante.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DateTimeSlot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 'Participante o ronda no encontrados.'

    put:
      tags:
        - Participaciones
      summary: Establecer o actualizar la disponibilidad del participante
      description: >
        El jugador/capitán/árbitro elige sus franjas disponibles basándose en la disponibilidad 
        previa de la ubicación. Sobrescribe sus preferencias anteriores para esta ronda.
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
        - in: path
          name: phaseId
          required: true
          schema:
            type: integer
        - in: path
          name: roundId
          required: true
          schema:
            type: integer
        - in: path
          name: participantId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DateTimeSlot'
      responses:
        '200':
          description: 'Disponibilidad del participante guardada correctamente.'
        '400':
          description: 'Alguna de las franjas elegidas no está dentro de la disponibilidad permitida por la liga.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Prohibido: Un usuario solo puede modificar su propia disponibilidad.'

  /leagues/{leagueId}/phases/{phaseId}:
    get:
      tags:
        - Fases
      summary: Obtener los detalles de una fase concreta (Grupos o Eliminatorias)
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
        - in: path
          name: phaseId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Detalle de la fase'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhaseDetails'
        '404':
          description: 'Fase o liga no encontrada.'

  /leagues/{leagueId}/my-status:
    get:
      tags:
        - Ligas
      summary: Obtener el contexto del usuario actual en la liga
      parameters:
        - in: path
          name: leagueId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Contexto recuperado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLeagueStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
