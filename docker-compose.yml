version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: tfg_postgres
    environment:
      POSTGRES_DB: sports_league_db
      POSTGRES_USER: tfg_admin
      POSTGRES_PASSWORD: tfg_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: tfg_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tfg.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres-db
    restart: unless-stopped

volumes:
  postgres_data: